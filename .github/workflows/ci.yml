name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: hannibal
          POSTGRES_USER: hannibal
          POSTGRES_PASSWORD: hannibal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hannibal -d hannibal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          python -m pylint apps/ --errors-only
      - name: Import check
        run: |
          python -c "from apps.api.app.main import app; print('API loads OK')"
      - name: Unit and integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://hannibal:hannibal@localhost:5432/hannibal
        run: |
          python -m pytest tests/ -v

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security scan
        run: |
          pip install bandit
          bandit -r apps/ -lll