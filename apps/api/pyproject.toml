[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hannibal-api"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "pgvector",
    "minio",
    "redis",
    "pydantic",
    "bcrypt",
    "python-jose",
]

[project.scripts]
hannibal-api = "app.main:main"